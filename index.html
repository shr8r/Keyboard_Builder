<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keyboard Builder</title>
<style>
:root{--bg:#eef3ff;--ink:#222;--k:clamp(34px,5.6vw,58px);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1f2e;--ink:#f2f2f2}}
*{box-sizing:border-box}
html,body{margin:0;font-family:"Trebuchet MS","Comic Sans MS",Verdana,sans-serif;background:var(--bg);color:var(--ink);min-height:100%}
body{transition:background .3s}
h1{margin:.3em 0;text-align:center;font-size:clamp(26px,5vw,44px)}
.hidden{display:none!important}
/* welcome */
#welcome{max-width:900px;margin:0 auto;padding:16px;text-align:center}
#welcome p{font-size:clamp(16px,2.5vw,22px)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:20px}
.card{border:4px solid #fff;border-radius:20px;padding:16px;cursor:pointer;font:inherit;font-size:22px;font-weight:bold;background:#fff;color:#222;box-shadow:0 4px 12px #0003;transition:transform .15s}
.card:hover{transform:scale(1.05)}
.card .row{display:flex;gap:6px;justify-content:center;margin-bottom:10px;padding:10px;border-radius:12px}
.card.t-glow .row{background:#0b0b18}.card.t-metal .row{background:#555}.card.t-pink .row{background:#ffe9f2}.card.t-packer .row{background:#e8efe9}.card.t-brewers .row{background:#e6ebf5}.card.t-cookie .row{background:#fff1dc}.card.t-pizza .row{background:#fff6e0}
/* game */
#hud{display:flex;justify-content:center;align-items:center;padding:6px 14px;gap:10px;flex-wrap:wrap}
#hud button{font:inherit;font-weight:bold;padding:8px 14px;border-radius:12px;border:2px solid #888;background:#fff;color:#222;cursor:pointer}
#tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:calc(var(--k)*2.6);padding:12px;margin:0 10px;border-radius:18px;background:#8883;border:3px dashed #8886}
#board{margin:18px auto;padding:16px 12px;border-radius:22px;width:fit-content;max-width:100%;box-shadow:0 8px 20px #0004}
.krow{display:flex;gap:6px;justify-content:center;margin:6px 0}
.krow:nth-child(2){margin-left:calc(var(--k)*.5)}.krow:nth-child(3){margin-left:calc(var(--k)*1)}.krow:nth-child(4){margin-left:calc(var(--k)*1.5)}
.slot,.key{width:var(--k);height:var(--k);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:calc(var(--k)*.5);font-weight:bold;position:relative;user-select:none}
.slot{border:3px dashed #888a;background:#fff4;color:#888}
.slot span{opacity:.3}
.slot.over{background:#ffe96688;border-color:#f90;transform:scale(1.1)}
.key{cursor:grab;background:var(--c);color:#222;box-shadow:0 3px 0 #0004,0 4px 6px #0003;text-shadow:0 1px 0 #fff8}
.key:active{cursor:grabbing}
.key.placed{cursor:default;animation:pop .35s}
.key.shake{animation:shake .4s}
@keyframes pop{50%{transform:scale(1.3)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* themes */
.theme-glow .key{background:#0d0d1a;color:var(--c);border:2px solid var(--c);box-shadow:0 0 8px var(--c),0 0 18px var(--c),inset 0 0 8px #fff2;text-shadow:0 0 8px var(--c)}
.theme-pink .key{color:#6b1239}
.theme-packer .key,.theme-brewers .key{background:var(--c);color:var(--c2);border:2px solid var(--c2);text-shadow:none}
.theme-metal .key{background:linear-gradient(145deg,#fafafa,#9aa0a6 45%,#d9dde0 55%,#6d7278);color:#222;border:2px solid #5a5f64;text-shadow:0 1px 0 #fffc;box-shadow:inset 0 2px 2px #fff,0 3px 0 #333,0 5px 6px #0006}
.theme-ice .key{background:repeating-linear-gradient(45deg,#e6b46f 0 5px,#d79f55 5px 6px),#e6b46f;overflow:visible;color:#4a2a10;border-radius:12px;z-index:1}
.theme-ice .key::before{content:"";position:absolute;left:-3px;right:-3px;top:-3px;height:62%;background:var(--c);border-radius:16px 16px 6px 6px;z-index:-1}
.theme-ice .key::after{content:"";position:absolute;left:22%;top:55%;width:22%;height:42%;background:var(--c);border-radius:0 0 10px 10px;z-index:-1;box-shadow:calc(var(--k)*.38) -6px 0 0 var(--c)}
.theme-ice .key{z-index:0}
.theme-ice .key>b{position:relative;z-index:2;text-shadow:0 1px 0 #fff9}
/* board backgrounds */
.theme-rainbow#board{background:linear-gradient(135deg,#fff,#e8f0ff)}.theme-glow#board{background:#05050f}.theme-pink#board{background:#ffe0ee}
.theme-packer#board{background:#e8efe9}.theme-brewers#board{background:#e6ebf5}.theme-cookie#board{background:#fff1dc}.theme-pizza#board{background:#fff6e0}
.theme-pizza .key{border-radius:50%;border:4px solid #d9993d;color:#4a1a0a;text-shadow:0 1px 0 #fff9;background:radial-gradient(circle at 20% 22%,#c0392b 0 5px,transparent 6px),radial-gradient(circle at 80% 24%,#c0392b 0 4px,transparent 5px),radial-gradient(circle at 78% 80%,#c0392b 0 5px,transparent 6px),radial-gradient(circle at 22% 80%,#c0392b 0 4px,transparent 5px),radial-gradient(circle at 50% 6%,#2e8b3d 0 2px,transparent 3px),radial-gradient(circle at 50% 96%,#2e8b3d 0 2px,transparent 3px),var(--c)}
.theme-cookie .key{border-radius:50%;border:2px solid #b87a35;color:#3b2210;text-shadow:0 1px 0 #fff8;background:radial-gradient(circle at 20% 24%,#4a2511 0 3px,transparent 4px),radial-gradient(circle at 78% 22%,#4a2511 0 2.5px,transparent 3.5px),radial-gradient(circle at 76% 78%,#4a2511 0 3px,transparent 4px),radial-gradient(circle at 24% 78%,#4a2511 0 2.5px,transparent 3.5px),radial-gradient(circle at 50% 10%,#4a2511 0 2px,transparent 3px),radial-gradient(circle at 50% 92%,#4a2511 0 2px,transparent 3px),var(--c)}.theme-ice#board{background:#fff3f8}.theme-metal#board{background:#444}
/* popup */
#win{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#win .box{background:#fff;color:#222;border-radius:28px;padding:30px;text-align:center;max-width:460px;animation:pop .5s}
#win h2{font-size:clamp(28px,6vw,42px);margin:.2em 0}
#win button{font:inherit;font-size:20px;font-weight:bold;margin:6px;padding:10px 20px;border-radius:14px;border:0;background:#4a7cff;color:#fff;cursor:pointer}
</style>
</head>
<body>
<div id="welcome">
  <h1>⌨️ Keyboard Builder</h1>
  <p>Drag each key to its spot on the keyboard. What kind of keyboard would you like to play on?</p>
  <div class="cards" id="cards"></div>
</div>

<div id="game" class="hidden">
  <div id="hud">
    
    <strong id="count"></strong>
  </div>
  <div id="tray"></div>
  <div id="board"></div>
</div>

<div id="win" class="hidden">
  <div class="box">
    <div style="font-size:64px">🎉🏆🎉</div>
    <h2>Congratulations!</h2>
    <p style="font-size:20px">You completed the whole keyboard!</p>
    <button id="again">Play again</button>
    <button id="change">New keyboard</button>
  </div>
</div>

<script>
const ROWS=["1234567890","QWERTYUIOP","ASDFGHJKL","ZXCVBNM"];
const THEMES=[
 {id:"rainbow",name:"🌈 Rainbow"},{id:"glow",name:"✨ Glowing"},{id:"pink",name:"💗 Pink"},
 {id:"packer",name:"🏈 Packers"},{id:"ice",name:"🍦 Ice Cream"},{id:"metal",name:"🔩 Metal"},{id:"brewers",name:"⚾ Brewers"},{id:"cookie",name:"🍪 Chocolate Chip Cookie"},{id:"pizza",name:"🍕 Pizza"}];
const GLOWS=["#ff2d95","#00f0ff","#39ff14","#ffe600","#b44dff","#ff7b00"];
const ICE=["#ffb3d1","#c8f0ff","#fff2a8","#c9ffd0","#e2c6ff","#ffd1a6","#ffffff"];
function colors(theme,i){
  switch(theme){
    case"rainbow":return[`hsl(${(i*37)%360} 85% 62%)`];
    case"glow":return[GLOWS[i%GLOWS.length]];
    case"pink":return[`hsl(${325+(i*7)%20} ${55+(i*13)%40}% ${60+(i*11)%30}%)`];
    case"packer":return i%2?["#FFB612","#203731"]:["#203731","#FFB612"];
    case"ice":return[ICE[(i*3)%ICE.length]];
    case"brewers":return i%2?["#FFC52F","#12284B"]:["#12284B","#FFC52F"];
    case"cookie":return[`hsl(${33+(i*5)%10} 65% ${62+(i*7)%10}%)`];
    case"pizza":return[`hsl(${42+(i*4)%8} 95% ${60+(i*5)%10}%)`];
    default:return["#bbb"];
  }
}
function mkKey(ch,i,theme){
  const k=document.createElement("div");
  const[c,c2]=colors(theme,i);
  k.className="key";k.dataset.ch=ch;
  k.style.setProperty("--c",c);if(c2)k.style.setProperty("--c2",c2);
  k.innerHTML="<b>"+ch+"</b>";
  return k;
}
// welcome cards
const cards=document.getElementById("cards");
THEMES.forEach(t=>{
  const b=document.createElement("button");
  b.className="card t-"+t.id;
  const row=document.createElement("div");
  row.className="row theme-"+t.id;
  row.style.setProperty("--k","44px");
  "ABC".split("").forEach((ch,i)=>row.appendChild(mkKey(ch,i+2,t.id)));
  b.appendChild(row);b.appendChild(document.createTextNode(t.name));
  b.onclick=()=>start(t.id);
  cards.appendChild(b);
});

const $=id=>document.getElementById(id);
let theme="rainbow",placed=0,dragEl=null;
const TOTAL=ROWS.join("").length;

function start(t){
  theme=t;placed=0;
  $("welcome").classList.add("hidden");$("game").classList.remove("hidden");$("win").classList.add("hidden");
  const board=$("board"),tray=$("tray");
  board.innerHTML="";tray.innerHTML="";
  board.className="theme-"+t;tray.className="theme-"+t;
  let idx=0;const keys=[];
  ROWS.forEach(r=>{
    const row=document.createElement("div");row.className="krow";
    r.split("").forEach(ch=>{
      const s=document.createElement("div");s.className="slot";s.dataset.ch=ch;
      
      s.addEventListener("dragover",e=>{e.preventDefault();s.classList.add("over")});
      s.addEventListener("dragleave",()=>s.classList.remove("over"));
      s.addEventListener("drop",e=>{e.preventDefault();s.classList.remove("over");drop(s)});
      row.appendChild(s);
      keys.push(mkKey(ch,idx++,t));
    });
    board.appendChild(row);
  });
  keys.sort(()=>Math.random()-.5);
  keys.forEach(k=>{
    k.draggable=true;
    k.addEventListener("dragstart",e=>{dragEl=k;e.dataTransfer.setData("text/plain",k.dataset.ch);e.dataTransfer.effectAllowed="move";setTimeout(()=>k.style.opacity=".4",0)});
    k.addEventListener("dragend",()=>{k.style.opacity="";dragEl=null});
    tray.appendChild(k);
  });
  updateCount();
}
function drop(slot){
  if(!dragEl)return;
  const k=dragEl;
  if(k.dataset.ch===slot.dataset.ch){
    k.draggable=false;k.style.opacity="";k.classList.add("placed");
    slot.replaceWith(k);
    placed++;updateCount();
    if(placed===TOTAL)setTimeout(()=>$("win").classList.remove("hidden"),500);
  }else{
    k.classList.remove("shake");void k.offsetWidth;k.classList.add("shake");
  }
}
function updateCount(){$("count").textContent=placed+" of "+TOTAL+" keys placed"}
$("change").onclick=()=>{$("game").classList.add("hidden");$("win").classList.add("hidden");$("welcome").classList.remove("hidden")};
$("again").onclick=()=>start(theme);
</script>
</body>
</html>
